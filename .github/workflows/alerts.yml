name: NQAD Alerts
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nqad-alerts
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check YouTube
        env:
          LIVE_WEBHOOK: ${{ secrets.LIVE_WEBHOOK }}
          VIDEO_WEBHOOK: ${{ secrets.VIDEO_WEBHOOK }}
          ROLE_ID: ${{ secrets.ROLE_ID }}
        run: python alerts.py
      - name: Save state
        run: |
          git config user.name "nqad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
